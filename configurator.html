<!doctype html><html lang="ko"><meta charset="utf-8"><title>XENEON RGB 달력 v7 설정</title><style>body{background:#111116;color:#f6f6fa;font-family:Arial,'Malgun Gothic',sans-serif;margin:20px auto;max-width:850px}iframe{display:block;width:100%;height:420px;border:0;background:#000;border-radius:18px}label{display:flex;justify-content:space-between;margin:16px 0 6px}input[type=range]{width:100%;accent-color:#ff00ff}input[type=url]{width:98%;padding:12px;background:#20202a;color:white;border:1px solid #666;border-radius:8px}button{background:#bb13b7;color:#fff;border:0;border-radius:9px;padding:12px 20px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#20202a;padding:14px}p{color:#aaa}</style><h2>XENEON EDGE RGB 달력 v7</h2><p>시계는 제거했고, 상단에는 “몇 년 몇 월 몇 일 무슨요일”만 표시됩니다. 외곽 RGB 선은 항상 선명하며, 배경 투명도만 조절됩니다.</p><iframe id="preview" src="index.html"></iframe><label>RGB 포인트 색상 <input id="color" type="color" value="#ff00ff"></label><label>검은 배경 불투명도 <output id="ov">92%</output></label><input id="opacity" type="range" min="0" max="100" value="92"><label>둥근 모서리 <output id="rv">28px</output></label><input id="round" type="range" min="18" max="56" value="28"><label>RGB 발광 <output id="gv">42%</output></label><input id="glow" type="range" min="0" max="100" value="42"><p>GitHub Pages 게시 주소:</p><input type="url" id="url" placeholder="https://아이디.github.io/xeneon-calendar/"><p><button id="copy">iFrame 코드 복사</button></p><pre id="output"></pre><script>const ids=['color','opacity','round','glow','url'];function update(){const params=new URLSearchParams();ids.slice(0,4).forEach(id=>params.set(id,document.getElementById(id).value));preview.src='index.html?'+params;ov.textContent=opacity.value+'%';rv.textContent=round.value+'px';gv.textContent=glow.value+'%';let code='게시 주소를 입력하세요.';try{const u=new URL(url.value);if(u.protocol!=='https:')throw Error();u.search=params.toString();code='<iframe src="'+u.toString().replace(/&/g,'&amp;')+'" width="100%" height="100%" style="border:0;background:#000" scrolling="no"></iframe>'}catch(e){}output.textContent=code;return code}ids.forEach(id=>document.getElementById(id).addEventListener('input',update));copy.onclick=async()=>{const code=update();if(!code.startsWith('<iframe'))return alert('GitHub Pages 주소를 입력하세요.');try{await navigator.clipboard.writeText(code);alert('코드 복사 완료')}catch(e){alert('아래 코드를 직접 복사하세요.')}};update();</script></html>
