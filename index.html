<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Neon Edge Calendar</title><style>
:root{--accent:#ff00ff;--rgb:255,0,255;--edge:.92;--radius:24px;--thick:2px;--glow:45;--text:#fff;}
*{box-sizing:border-box}html,body{padding:0;margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden;font-family:Arial,'Malgun Gothic',sans-serif;color:var(--text)}
.shell{height:100%;width:100%;border-radius:var(--radius);border:var(--thick) solid rgba(var(--rgb),var(--edge));background:transparent;box-shadow:inset 0 0 calc(var(--glow)*.13px) rgba(var(--rgb),.14),0 0 calc(var(--glow)*.20px) rgba(var(--rgb),.55);padding:clamp(9px,2.2vw,20px);display:flex;gap:6px;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;flex:none;gap:12px}.eyebrow{font-size:clamp(10px,1.3vw,14px);font-weight:700;letter-spacing:.17em;color:var(--accent)}.month{font-size:clamp(15px,2.4vw,25px);font-weight:750;letter-spacing:-.04em}.today{font-size:clamp(10px,1.3vw,14px);color:#c4bacd}.line{height:1px;background:linear-gradient(90deg,rgba(var(--rgb),.7),rgba(var(--rgb),0));flex:none}
.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}.week{flex:none;font-size:clamp(10px,1.5vw,14px);font-weight:650;color:#beb8c7;line-height:1.9}.week span:first-child{color:#ff8ccd}.days{flex:1;min-height:0;grid-template-rows:repeat(6,minmax(0,1fr));gap:1px}.cell{min-height:0;display:flex;justify-content:center;align-items:center;font-weight:650;font-size:clamp(12px,2vw,20px);color:#f6effc}.cell.mute{opacity:0}.cell.sun{color:#ffa2d6}.cell.today span{color:#fff;background:var(--accent);border-radius:10px;min-width:clamp(23px,3.5vw,36px);height:clamp(23px,3.5vw,36px);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(var(--rgb),.7)}
@media(max-height:260px){.shell{padding:7px 13px;gap:2px}.week{line-height:1.3}.month{font-size:15px}.cell{font-size:12px}.cell.today span{min-width:19px;height:19px;border-radius:7px}}
</style></head><body><main class="shell"><header class="top"><div><div class="eyebrow">NEON CALENDAR</div><div class="month" id="title"></div></div><div class="today" id="todayText"></div></header><div class="line"></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><section class="days" id="days"></section></main><script>
const q=new URLSearchParams(location.search);const root=document.documentElement;
const col=/^#[0-9a-fA-F]{6}$/.test(q.get('color')||'')?q.get('color'):'#FF00FF';
const rgb=[1,3,5].map(i=>parseInt(col.slice(i,i+2),16)).join(',');
const n=(name,def,min,max)=>Math.max(min,Math.min(max,Number(q.get(name))||def));
root.style.setProperty('--accent',col);root.style.setProperty('--rgb',rgb);root.style.setProperty('--edge',String(n('opacity',92,1,100)/100));root.style.setProperty('--radius',n('radius',24,0,60)+'px');root.style.setProperty('--thick',n('border',2,0,8)+'px');root.style.setProperty('--glow',String(n('glow',45,0,100)));
function draw(){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();document.getElementById('title').textContent=`${y}년 ${String(m+1).padStart(2,'0')}월`;document.getElementById('todayText').textContent=`${m+1}.${now.getDate()} ${['일','월','화','수','목','금','토'][now.getDay()]}요일`;let html='';for(let i=0;i<42;i++){const d=i-first+1;const day=d>=1&&d<=last;const today=day&&d===now.getDate();html+=`<div class="cell ${day?'':'mute'} ${i%7===0?'sun':''} ${today?'today':''}"><span>${day?d:''}</span></div>`;}document.getElementById('days').innerHTML=html;}draw();setInterval(draw,60000);
</script></body></html>
