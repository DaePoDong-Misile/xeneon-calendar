<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XENEON EDGE RGB Calendar v7</title>
<style>
:root{--accent:#ff00ff;--rgb:255,0,255;--bg:0.92;--round:28px;--glow:.42;--sun:#ff6279;--sat:#63afff;--cyan:#5fc8ff;--purple:#b779ff}
*{box-sizing:border-box}
html,body{height:100%;width:100%;margin:0;overflow:hidden;background:transparent;color:#f8f9fd;font-family:'Malgun Gothic','Segoe UI',sans-serif}
button{font:inherit;cursor:pointer}
.shell{
  position:relative;height:100%;width:100%;border-radius:var(--round);overflow:hidden;
  background:rgba(0,0,0,var(--bg));
  box-shadow:0 0 calc(var(--glow)*22px) rgba(255,0,255,.20),0 0 calc(var(--glow)*26px) rgba(95,200,255,.14),inset 0 0 0 1px rgba(255,255,255,.03);
}
.shell::before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:
    radial-gradient(ellipse at 2% 0%,rgba(255,0,255,.085),transparent 40%),
    radial-gradient(ellipse at 100% 100%,rgba(95,200,255,.07),transparent 38%),
    linear-gradient(180deg,rgba(255,255,255,.04),transparent 12%);
}
.shell::after{
  content:"";position:absolute;inset:0;padding:2px;border-radius:inherit;pointer-events:none;
  background:linear-gradient(90deg,#ff3fce 0%,#c86fff 26%,#63afff 62%,#3ef0ff 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.inner{position:relative;width:100%;height:100%;padding:clamp(12px,2.5vw,23px) clamp(14px,3vw,27px) clamp(10px,1.9vw,17px);display:grid;grid-template-rows:26% minmax(0,1fr);gap:4px}
.header{min-height:0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.month-head{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.eyebrow{font-size:clamp(8px,1.5vw,11px);letter-spacing:.24em;font-weight:700;color:#a8a9b9}
.title{margin:0;white-space:nowrap;line-height:1.05;letter-spacing:-.075em;font-size:clamp(27px,6.8vw,56px);font-weight:860;color:#fff}
.title em{font-style:normal;background:linear-gradient(90deg,#ff36cf 0%,#bc65ff 45%,#61b5ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tools{display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:12px;flex-shrink:0}
.todayinfo{font-size:clamp(10px,2.0vw,17px);font-weight:780;color:#f4f5fa;white-space:nowrap;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.navrow{display:flex;gap:7px;align-items:center}
.nav{height:clamp(28px,5.9vw,37px);width:clamp(28px,5.9vw,37px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.18);background:#101017;border-radius:50%;color:#fff;font-size:clamp(18px,3.4vw,24px);line-height:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02)}
.nav:hover{border-color:#ff4dd6;background:#231129}
.calendar{display:grid;grid-template-rows:12% minmax(0,1fr);min-height:0}
.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.week{align-items:center}
.week span{font-size:clamp(12px,2.7vw,20px);font-weight:850;color:#d7dae4}
.week .sun{color:var(--sun)}.week .sat{color:var(--sat)}
.days{grid-template-rows:repeat(6,minmax(0,1fr));min-height:0}
.day{position:relative;display:flex;justify-content:center;align-items:center;min-width:0;min-height:0;font-variant-numeric:tabular-nums;font-size:clamp(18px,4.05vw,35px);font-weight:830;letter-spacing:-.04em;color:#f9faff}
.day.sun{color:var(--sun)}.day.sat{color:var(--sat)}
.day.out{color:#4f515d}.day.out.sun{color:#673b46}.day.out.sat{color:#374d6a}
.day.today{z-index:0;color:#fff;font-weight:920}
.day.today::before{content:"";position:absolute;width:min(78%,6vh);height:min(78%,6vh);min-width:30px;min-height:30px;border:2px solid #ff5ed8;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.08),transparent 52%),linear-gradient(135deg,rgba(255,0,255,.18),rgba(98,168,255,.12));border-radius:50%;z-index:-1;box-shadow:0 0 12px rgba(255,0,255,.20),0 0 18px rgba(95,200,255,.10)}
@media(min-width:840px){.inner{padding:22px 34px 20px}.tools{gap:16px}.calendar{grid-template-rows:13% 1fr}.day{font-size:clamp(28px,2.6vw,45px)}}
</style>
</head>
<body>
<main class="shell">
  <div class="inner">
    <header class="header">
      <div class="month-head">
        <div class="eyebrow">CALENDAR · MONTHLY</div>
        <h1 class="title" id="monthTitle"></h1>
      </div>
      <div class="tools">
        <div class="todayinfo" id="todayInfo"></div>
        <div class="navrow">
          <button class="nav" id="prev" aria-label="이전 달">‹</button>
          <button class="nav" id="next" aria-label="다음 달">›</button>
        </div>
      </div>
    </header>
    <section class="calendar">
      <div class="week"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span></div>
      <div class="days" id="days"></div>
    </section>
  </div>
</main>
<script>
const query=new URLSearchParams(location.search),hex=/^#[0-9a-f]{6}$/i.test(query.get('color')||'')?query.get('color'):'#ff00ff';
const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)).join(',');
function bounded(s,a,b,d){if(s===null||s==='')return d;const v=Number(s);return Number.isFinite(v)?Math.max(a,Math.min(b,v)):d}
const root=document.documentElement;
root.style.setProperty('--accent',hex);root.style.setProperty('--rgb',rgb);
root.style.setProperty('--bg',bounded(query.get('opacity'),0,100,92)/100);
root.style.setProperty('--round',bounded(query.get('round'),18,56,28)+'px');
root.style.setProperty('--glow',bounded(query.get('glow'),0,100,42)/100);
let now=new Date(),year=now.getFullYear(),month=now.getMonth();
const weekdays=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
function render(){
  document.getElementById('monthTitle').innerHTML=year+'년 <em>'+String(month+1)+'월</em>';
  const start=new Date(year,month,1).getDay(), daysEl=document.getElementById('days');
  daysEl.replaceChildren();
  for(let i=0;i<42;i++){
    const date=new Date(year,month,i-start+1),node=document.createElement('span'),col=i%7;
    node.className='day'+(col===0?' sun':col===6?' sat':'')+(date.getMonth()!==month?' out':'')+(date.toDateString()===now.toDateString()?' today':'');
    node.textContent=date.getDate();
    daysEl.appendChild(node);
  }
}
function tick(){
  const old=now; now=new Date();
  document.getElementById('todayInfo').textContent=now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일 '+weekdays[now.getDay()];
  if(old.toDateString()!==now.toDateString()) render();
}
document.getElementById('prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};
document.getElementById('next').onclick=()=>{month++;if(month>11){month=0;year++}render()};
render(); tick(); setInterval(tick,10000);
</script>
</body>
</html>
